<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYXA – The Architecture of Becoming</title>
<!--
  Preview player and offline render target for "NYXA – The Architecture of Becoming", Episode 01.
  Preview:  open via a local web server from film/architecture-of-becoming/ (e.g. `python3 -m http.server`)
            -> /src/index.html  (plays ../out/audio/film_mix.wav if it has been built)
  Render:   /src/index.html?render=1&w=1920&h=1080[&subs=en]  -> window.FILM.renderFrame(t)
  Author: Claude (Anthropic), Claude Code session 2026-11-25, for Johannes Süß / NYXA / Digitalleria. DRAFT · IN_REVIEW.
-->
<style>
  @font-face { font-family: "Cormorant"; src: url("fonts/CormorantGaramond-normal.woff2") format("woff2"); font-weight: 300 700; font-style: normal; }
  @font-face { font-family: "Cormorant"; src: url("fonts/CormorantGaramond-italic.woff2") format("woff2"); font-weight: 300; font-style: italic; }
  :root { --bg: #040507; --fg: #EFE8DC; --dim: #8C8578; --gold: #E9B96E; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; display: block; }
  #ui { position: fixed; left: 16px; right: 16px; bottom: 12px; display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--dim); opacity: 0; transition: opacity .4s; }
  body:hover #ui { opacity: 1; }
  #bar { flex: 1; height: 4px; background: #222; border-radius: 2px; cursor: pointer; position: relative; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); border-radius: 2px; }
  button { background: none; border: 1px solid #333; color: var(--fg); border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="film"></canvas></div>
<div id="ui">
  <button id="play">Play</button>
  <button id="sub">Subtitles: off</button>
  <div id="bar"><div id="fill"></div></div>
  <span id="clock">0:00</span>
</div>
<script src="timeline.js"></script>
<script src="film.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const F = window.FILM;
  if (q.get("render")) {
    document.body.classList.add("render");
    F.resize(+q.get("w") || 1920, +q.get("h") || 1080);
    const subs = q.get("subs") || null;
    window.renderAt = (t) => F.renderFrame(t, { subs });
    window.fontsReady = document.fonts.load("300 40px Cormorant").then(() => document.fonts.load("italic 300 40px Cormorant")).then(() => true);
    return;
  }
  const portrait = q.get("portrait") === "1";
  F.resize(portrait ? 1080 : 1920, portrait ? 1920 : 1080);
  const audio = new Audio("../out/audio/film_mix.wav");
  let playing = false, t0 = 0, start = 0, subs = null;
  const langs = [null, "en", "de"];
  const now = () => (playing ? (audio.readyState > 1 && !audio.error ? audio.currentTime : t0 + (performance.now() - start) / 1000) : t0);
  function fmt(s) { return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); }
  function loop() {
    const t = Math.min(now(), F.duration);
    F.renderFrame(t, { subs });
    document.getElementById("fill").style.width = (100 * t / F.duration) + "%";
    document.getElementById("clock").textContent = fmt(t) + " / " + fmt(F.duration);
    if (t >= F.duration) { playing = false; t0 = 0; }
    requestAnimationFrame(loop);
  }
  function toggle() {
    if (playing) { t0 = now(); playing = false; audio.pause(); }
    else { playing = true; start = performance.now(); audio.currentTime = t0; audio.play().catch(() => {}); }
    document.getElementById("play").textContent = playing ? "Pause" : "Play";
  }
  document.getElementById("play").onclick = toggle;
  document.getElementById("sub").onclick = (e) => { subs = langs[(langs.indexOf(subs) + 1) % 3]; e.target.textContent = "Subtitles: " + (subs || "off"); };
  document.getElementById("bar").onclick = (e) => {
    const r = e.currentTarget.getBoundingClientRect(); t0 = F.duration * (e.clientX - r.left) / r.width;
    audio.currentTime = t0; start = performance.now();
  };
  addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); toggle(); } });
  if (q.get("t")) t0 = +q.get("t");
  document.fonts.ready.then(loop);
})();
</script>
</body>
</html>
