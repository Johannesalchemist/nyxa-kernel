<!doctype html><meta charset="utf-8"><title>avatar e2e</title>
<script type="module">
import { LiveAvatarLiteSink, NoopAvatarSink } from "./avatarSink.mjs";
import { attachAvatar } from "./roomAvatarIntegration.mjs";
window.runE2E = async (mode) => {
  // Real WebRTC loopback: pcA plays the role of the Realtime server (audio track + oai-events channel).
  const ctxA = new AudioContext({ sampleRate: 48000 }); const osc = ctxA.createOscillator(); const dst = ctxA.createMediaStreamDestination();
  osc.frequency.value = 220; osc.connect(dst); osc.start();
  const pcA = new RTCPeerConnection(), pcB = new RTCPeerConnection();
  pcA.onicecandidate = (e) => e.candidate && pcB.addIceCandidate(e.candidate); pcB.onicecandidate = (e) => e.candidate && pcA.addIceCandidate(e.candidate);
  pcA.addTrack(dst.stream.getAudioTracks()[0], dst.stream);
  const dcA = pcA.createDataChannel("oai-events"); const dcBp = new Promise((r) => (pcB.ondatachannel = (e) => r(e.channel)));
  const sent = []; const sink = mode === "noop" ? new NoopAvatarSink() : new LiveAvatarLiteSink({ send: (f) => sent.push(JSON.parse(f)) });
  if (mode !== "noop") sink.onProviderEvent({ type: "session.state_updated", state: "connected" });
  const voice = new Audio(); pcB.ontrack = (e) => { voice.srcObject = e.streams[0]; };  // the unchanged voice path
  await pcA.setLocalDescription(await pcA.createOffer()); await pcB.setRemoteDescription(pcA.localDescription);
  await pcB.setLocalDescription(await pcB.createAnswer()); await pcA.setRemoteDescription(pcB.localDescription);
  const dcB = await dcBp; await new Promise((r) => dcA.readyState === "open" ? r() : (dcA.onopen = r));
  const { bridge, detach } = await attachAvatar({ pc: pcB, dc: dcB, sink, workletUrl: "./avatarCaptureWorklet.js" });
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  await wait(300); const beforeSpeech = sent.length;
  dcA.send(JSON.stringify({ type: "output_audio_buffer.started" })); await wait(2300);
  dcA.send(JSON.stringify({ type: "output_audio_buffer.stopped" })); await wait(200);
  const afterTurn = sent.map((f) => f.type);
  dcA.send(JSON.stringify({ type: "output_audio_buffer.started" })); await wait(500);
  dcA.send(JSON.stringify({ type: "input_audio_buffer.speech_started" })); await wait(200);
  const all = sent.map((f) => f.type);
  const speakBytes = sent.filter((f) => f.type === "agent.speak").map((f) => atob(f.audio).length);
  detach(); pcA.close(); pcB.close(); osc.stop();
  return { beforeSpeech, afterTurn, all, speakBytes, voiceTrackPresent: !!voice.srcObject, speaking: bridge.speaking };
};
window.ready = true;
</script>
